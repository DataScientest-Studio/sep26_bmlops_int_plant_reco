# On every push and pull request to master: install the libraries,
# check the Python code with flake8 and run the tests in tests/.
name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # only warnings for everything else
        flake8 . --count --exit-zero --max-complexity=10 \
          --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # python -m adds the repo folder to the path, so "import src" works
        python -m pytest
