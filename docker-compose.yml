services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plants}
      POSTGRES_USER: ${POSTGRES_USER:-plants}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  loader:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["python", "-m", "src.data.make_dataset"]
    volumes:
      - ./data/raw/color:/app/data/raw/color:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw/color:/app/data/raw/color:ro
      - dvc_data:/app/dvc_data
    depends_on:
      db:
        condition: service_healthy
      loader:
        condition: service_completed_successfully
      mlflow:
        condition: service_started
    restart: unless-stopped

  mlflow-db:
    image: postgres:17
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-change-me}
    volumes:
      - mlflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mlflow:
    build:
      context: docker/mlflow
    environment:
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:-change-me}@mlflow-db:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts "*"
      --cors-allowed-origins "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      mlflow-db:
        condition: service_healthy
    restart: unless-stopped

  airflow:
    image: apache/airflow:3.1.8
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "4"
    ports:
      - "8080:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
    depends_on:
      - api
    restart: unless-stopped


  prometheus:
      image: prom/prometheus:v2.45.0
      container_name: prometheus
      volumes:
        - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        - prometheus_data:/prometheus
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.retention.time=1d' # Keep storage small for VM limits
      ports:
        - "9090:9090"
      restart: always

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always   

volumes:
  postgres_data:
  mlflow_db_data:
  mlflow_artifacts:
  airflow_home:
  dvc_data:
  prometheus_data: {}
  grafana_data: {}
